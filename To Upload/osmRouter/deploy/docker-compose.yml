# osmRouter — production docker-compose.
#
# Bring up:    docker compose -f deploy/docker-compose.yml --env-file ../.env up -d --build
# Update:      docker compose -f deploy/docker-compose.yml pull && up -d
# Tear down:   docker compose -f deploy/docker-compose.yml down
#
# NOTE: this compose file does NOT define defaults for secrets. Every value
# referenced as ${X} must be in your `.env` file. Use `.env.example` as a
# starting point and `./scripts/generate-secrets.sh` to mint the crypto bits.
#
# In production you should run this behind a reverse proxy that terminates
# TLS — see deploy/nginx.conf.example or deploy/caddy/Caddyfile.example.

name: osmrouter

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB:       ${POSTGRES_DB:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT exposed to host — only reachable from the docker network.

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT exposed to host.

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      OSM_ENV:               prod
      OSM_HTTP_ADDR:         ":8080"
      OSM_DATABASE_URL:      ${OSM_DATABASE_URL:?required}
      OSM_REDIS_URL:         ${OSM_REDIS_URL:?required}
      OSM_DEV_EXPOSE_OTP:    "false"
      OSM_PROXY_NODE_SECRET: ${OSM_PROXY_NODE_SECRET:?required}
      OSM_JWT_SECRET:        ${OSM_JWT_SECRET:?required}
      OSM_OTP_MASTER_SECRET: ${OSM_OTP_MASTER_SECRET:?required}
      OSM_CSRF_SECRET:       ${OSM_CSRF_SECRET:?required}
      OSM_AES_MASTER_KEY:    ${OSM_AES_MASTER_KEY:?required}
      OSM_CORS_ORIGINS:      ${OSM_CORS_ORIGINS:?required}
      OSM_COOKIE_DOMAIN:     ${OSM_COOKIE_DOMAIN:?required}
      OSM_COOKIE_SECURE:     "true"
      OSM_PROXY_CNAME:       ${OSM_PROXY_CNAME:?required}
      OSM_RL_AUTH:           ${OSM_RL_AUTH:-5}
      OSM_RL_NORMAL:         ${OSM_RL_NORMAL:-100}
      # Optional integrations — leave blank to disable that feature.
      SMTP_HOST:             ${SMTP_HOST:-}
      SMTP_PORT:             ${SMTP_PORT:-587}
      SMTP_USERNAME:         ${SMTP_USERNAME:-}
      SMTP_PASSWORD:         ${SMTP_PASSWORD:-}
      SMTP_FROM:             ${SMTP_FROM:-}
      CLOUDFLARE_API_TOKEN:  ${CLOUDFLARE_API_TOKEN:-}
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SENTRY_DSN:            ${SENTRY_DSN:-}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"   # bind to loopback only — TLS terminator forwards here

  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy
    restart: always
    depends_on:
      redis:  { condition: service_healthy }
      server: { condition: service_started }
    environment:
      OSM_PUBLIC_ADDR:       ":8000"
      OSM_TUNNEL_ADDR:       ":8001"
      OSM_REDIS_URL:         ${OSM_REDIS_URL:?required}
      OSM_CONTROL_PLANE_URL: http://server:8080
      OSM_PROXY_NODE_SECRET: ${OSM_PROXY_NODE_SECRET:?required}
      OSM_NODE_ID:           ${OSM_NODE_ID:-node-prod-01}
    ports:
      - "8000:8000"   # visitor traffic (front this with TLS terminator)
      - "8001:8001"   # tunnel listener (clients connect here — wss:// in prod)

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?required}
    restart: always
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"   # bind to loopback only — TLS terminator forwards here

volumes:
  postgres-data:
  redis-data:
