# osmRouter cloud-side stack — runs all backend services in containers.
# The Mac runs only the tunnel-client + the user's local app.
#
# Bring up:    docker compose -f deploy/docker-compose.yml up -d --build
# Tear down:   docker compose -f deploy/docker-compose.yml down -v
#
# Ports exposed to host:
#   - 3030  : Next.js dashboard          (browser → http://localhost:3030)
#   - 8080  : Control Plane API          (used by dashboard + proxy node)
#   - 6379  : Redis                      (used by proxy node + Control Plane)
#   - 8000  : Proxy public listener      (visitor traffic enters here)
#   - 8001  : Proxy tunnel listener      (osmrouter-client on Mac connects here)

name: osmrouter

services:
  redis:
    image: redis:7-alpine
    container_name: osm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: osm-server
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      OSM_ENV: dev
      OSM_HTTP_ADDR: ":8080"
      OSM_DATABASE_URL: sqlite:///data/osm.db
      OSM_REDIS_URL: redis://redis:6379
      OSM_DEV_EXPOSE_OTP: "true"
      OSM_PROXY_NODE_SECRET: ${OSM_PROXY_NODE_SECRET:-demo-proxy-secret}
      OSM_CORS_ORIGINS: http://localhost:3030,http://localhost:3000
      OSM_COOKIE_SECURE: "false"
      OSM_PROXY_CNAME: nodes.osmrouter.demo
    volumes:
      - server-data:/data

  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy
    container_name: osm-proxy
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    ports:
      - "8000:8000"   # public visitor traffic
      - "8001:8001"   # tunnel listener (Mac client dials this)
    environment:
      OSM_PUBLIC_ADDR: ":8000"
      OSM_TUNNEL_ADDR: ":8001"
      OSM_REDIS_URL: redis://redis:6379
      OSM_CONTROL_PLANE_URL: http://server:8080
      OSM_PROXY_NODE_SECRET: ${OSM_PROXY_NODE_SECRET:-demo-proxy-secret}
      OSM_NODE_ID: demo-proxy-01

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8080
    container_name: osm-web
    depends_on:
      - server
    ports:
      - "3030:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080

volumes:
  server-data:
