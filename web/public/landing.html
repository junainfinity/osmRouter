<html lang="en">
<head>

<title>osmRouter — Stop Renting the Internet</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.13 0.006 60);
    --bg-2: oklch(0.16 0.007 60);
    --surface: oklch(0.18 0.008 60);
    --surface-hi: oklch(0.22 0.008 60);
    --line: oklch(0.27 0.008 60);
    --line-soft: oklch(0.22 0.008 60);
    --ink: oklch(0.97 0.008 90);
    --ink-2: oklch(0.78 0.008 80);
    --ink-3: oklch(0.58 0.008 80);
    --accent: oklch(0.86 0.18 95);
    --accent-ink: oklch(0.18 0.05 80);
    --danger: oklch(0.72 0.16 30);
    --good: oklch(0.78 0.15 145);
    --shadow: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 24px 60px -30px oklch(0 0 0 / 0.6);
  }
  html[data-theme="light"] {
    --bg: oklch(0.97 0.006 90);
    --bg-2: oklch(0.94 0.006 90);
    --surface: oklch(0.99 0.004 90);
    --surface-hi: oklch(0.96 0.005 90);
    --line: oklch(0.85 0.008 80);
    --line-soft: oklch(0.90 0.006 80);
    --ink: oklch(0.18 0.01 80);
    --ink-2: oklch(0.40 0.01 80);
    --ink-3: oklch(0.55 0.01 80);
    --accent: oklch(0.78 0.18 85);
    --accent-ink: oklch(0.18 0.05 80);
    --shadow: 0 1px 0 oklch(1 0 0 / 0.6) inset, 0 24px 60px -36px oklch(0 0 0 / 0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Geist", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color 0.32s ease, color 0.32s ease;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .mono { font-family: "Geist Mono", ui-monospace, monospace; font-feature-settings: "ss01"; }
  .serif { font-family: "Instrument Serif", serif; font-weight: 400; }
  .grotesk { font-family: "Space Grotesk", system-ui, sans-serif; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- NAV ---------- */
  nav.top {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(14px);
    background: color-mix(in oklab, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--line-soft);
  }
  nav.top .row {
    display: flex; align-items: center; gap: 28px;
    height: 64px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "Space Grotesk"; font-weight: 600; letter-spacing: -0.01em;
    font-size: 17px;
  }
  .brand-mark {
    width: 26px; height: 26px;
    display: inline-block;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  html[data-theme="dark"] .brand-mark { background-image: url('/landing-assets/logo-dark.png'); }
  html[data-theme="light"] .brand-mark { background-image: url('/landing-assets/logo-light.png'); }
  .brand .word-osm, .brand .word-router { color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
  .nav-links {
    display: flex; gap: 22px; color: var(--ink-2);
    font-size: 14px;
    margin-left: 14px;
  }
  .nav-links a { transition: color .18s; }
  .nav-links a:hover { color: var(--ink); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; border-radius: 6px;
    font-size: 14px; font-weight: 500;
    border: 1px solid transparent;
    transition: transform .12s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-ghost { color: var(--ink-2); }
  .btn-ghost:hover { color: var(--ink); background: var(--surface); }
  .btn-outline { border-color: var(--line); color: var(--ink); }
  .btn-outline:hover { background: var(--surface); border-color: var(--ink-3); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-lg { padding: 14px 22px; font-size: 15px; }
  .btn-icon {
    width: 36px; height: 36px; padding: 0; border-radius: 6px;
    border: 1px solid var(--line-soft);
    color: var(--ink-2);
  }
  .btn-icon:hover { color: var(--ink); border-color: var(--line); background: var(--surface); }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    padding: 72px 0 100px;
    border-bottom: 1px solid var(--line-soft);
    overflow: hidden;
  }
  .hero-grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 80px 80px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, black, transparent 80%);
    opacity: 0.5;
    pointer-events: none;
  }
  .hero .inner {
    position: relative;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 56px;
    align-items: center;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "Geist Mono"; font-size: 12px; letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: color-mix(in oklab, var(--surface) 60%, transparent);
  }
  .eyebrow .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 70%, transparent);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 60%, transparent); }
    70%  { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  h1.headline {
    font-family: "Instrument Serif";
    font-weight: 400;
    letter-spacing: -0.015em;
    font-size: clamp(56px, 7vw, 104px);
    line-height: 0.96;
    margin: 22px 0 0;
    color: var(--ink);
    text-wrap: balance;
  }
  h1.headline em {
    font-style: italic;
    color: var(--accent);
  }
  .problem {
    margin-top: 28px;
    font-size: 18px; line-height: 1.5;
    color: var(--ink-2);
    max-width: 580px;
  }
  .sub {
    margin-top: 18px;
    font-size: 15px; line-height: 1.6;
    color: var(--ink-3);
    max-width: 560px;
  }
  .hero-ctas {
    margin-top: 36px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .hero-meta {
    margin-top: 32px;
    display: flex; gap: 28px; flex-wrap: wrap;
    color: var(--ink-3);
    font-size: 13px;
  }
  .hero-meta .check { color: var(--accent); margin-right: 6px; }

  /* ---------- ROUTER VIS ---------- */
  .router-card {
    position: relative;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg-2) 100%);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .router-head {
    display: flex; align-items: center; justify-content: space-between;
    font-family: "Geist Mono"; font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .router-head .dots { display: inline-flex; gap: 5px; }
  .router-head .dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line);
  }
  .router-head .dots i.live { background: var(--good); box-shadow: 0 0 8px color-mix(in oklab, var(--good) 60%, transparent); }

  .route-list { display: flex; flex-direction: column; gap: 10px; padding: 16px 0 6px; }
  .route {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    background: var(--bg);
    font-size: 13px;
  }
  .route .from { font-family: "Geist Mono"; color: var(--ink); }
  .route .arrow {
    color: var(--ink-3);
    display: flex; align-items: center; gap: 6px;
  }
  .route .to { font-family: "Geist Mono"; color: var(--ink-2); }
  .route .stat {
    font-family: "Geist Mono"; font-size: 11px;
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line-soft);
    color: var(--good);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .route .stat .ll {
    width: 6px; height: 6px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 6px color-mix(in oklab, var(--good) 60%, transparent);
  }
  .route .traffic-line {
    grid-column: 1 / -1;
    height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 50% 100%;
    background-repeat: no-repeat;
    animation: zip 2.4s linear infinite;
    opacity: 0.55;
  }
  .route:nth-child(2) .traffic-line { animation-delay: -0.6s; }
  .route:nth-child(3) .traffic-line { animation-delay: -1.2s; }
  @keyframes zip {
    0%   { background-position: -60% 0; }
    100% { background-position: 160% 0; }
  }
  .router-foot {
    margin-top: 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "Geist Mono"; font-size: 11px; color: var(--ink-3);
    padding-top: 14px;
    border-top: 1px dashed var(--line-soft);
  }
  .ascii {
    font-family: "Geist Mono"; font-size: 11px; color: var(--ink-3);
    white-space: pre; line-height: 1.35;
  }
  .ascii b { color: var(--accent); font-weight: 400; }

  /* ---------- SECTION ---------- */
  section {
    padding: 110px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .section-head {
    display: grid; grid-template-columns: 1fr 1.6fr; gap: 48px;
    margin-bottom: 56px;
    align-items: end;
  }
  .section-tag {
    font-family: "Geist Mono"; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
    display: flex; align-items: center; gap: 10px;
  }
  .section-tag .num {
    padding: 3px 8px; border-radius: 4px;
    background: var(--surface); border: 1px solid var(--line-soft);
    color: var(--accent);
  }
  .section-title {
    font-family: "Instrument Serif"; font-size: clamp(36px, 4.6vw, 64px);
    line-height: 1.02; letter-spacing: -0.015em;
    margin: 14px 0 0;
    text-wrap: balance;
  }
  .section-title em { font-style: italic; color: var(--accent); }
  .section-lede {
    font-size: 17px; color: var(--ink-2);
    max-width: 540px; line-height: 1.55;
  }

  /* features */
  .feat-grid {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;
  }
  .feat {
    grid-column: span 6;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    display: flex; flex-direction: column; gap: 18px;
    min-height: 320px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s ease, background-color .2s ease;
  }
  .feat:hover { border-color: var(--ink-3); }
  .feat-label {
    font-family: "Geist Mono"; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
    display: flex; justify-content: space-between;
  }
  .feat-label .id { color: var(--accent); }
  .feat h3 {
    font-family: "Space Grotesk"; font-weight: 500;
    font-size: 24px; line-height: 1.15; letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .feat p {
    margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.55;
  }
  .feat-art {
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px dashed var(--line-soft);
  }

  /* feat art components */
  .terminal {
    font-family: "Geist Mono"; font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--ink-2);
    line-height: 1.65;
  }
  .terminal .prompt { color: var(--accent); }
  .terminal .ok { color: var(--good); }
  .terminal .arrow { color: var(--ink-3); }

  .devices {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .device-chip {
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--bg);
  }
  .device-chip .name { font-family: "Geist Mono"; font-size: 12px; color: var(--ink); }
  .device-chip .meta { font-family: "Geist Mono"; font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }
  .device-chip .bar {
    height: 4px; border-radius: 2px;
    background: var(--surface-hi); overflow: hidden;
    margin-top: 4px;
  }
  .device-chip .bar i {
    display: block; height: 100%; background: var(--accent);
    animation: bar 3.4s ease-in-out infinite alternate;
  }
  .device-chip:nth-child(2) .bar i { animation-delay: -1.1s; }
  .device-chip:nth-child(3) .bar i { animation-delay: -2.2s; }
  @keyframes bar { 0% { width: 18%; } 100% { width: 86%; } }

  .subdomain-table {
    display: flex; flex-direction: column; gap: 6px;
    font-family: "Geist Mono"; font-size: 12px;
  }
  .subdomain-row {
    display: grid; grid-template-columns: 1.4fr auto 1fr;
    gap: 10px; align-items: center;
    padding: 8px 10px;
    border: 1px solid var(--line-soft); border-radius: 6px;
    background: var(--bg);
  }
  .subdomain-row .key { color: var(--ink); }
  .subdomain-row .a { color: var(--ink-3); }
  .subdomain-row .v { color: var(--accent); }

  .lock-vis {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    padding: 10px 14px;
    border: 1px solid var(--line-soft); border-radius: 8px;
    background: var(--bg);
    font-family: "Geist Mono"; font-size: 12px;
  }
  .lock-vis .hwid { color: var(--ink); }
  .lock-vis .key { color: var(--accent); }
  .lock-vis .badge {
    font-size: 10px; padding: 3px 8px; border-radius: 999px;
    background: color-mix(in oklab, var(--good) 18%, transparent);
    color: var(--good);
    border: 1px solid color-mix(in oklab, var(--good) 40%, transparent);
  }

  /* downloads */
  .download-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  }
  .download-card {
    position: relative;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    display: flex; flex-direction: column; gap: 18px;
    overflow: hidden;
    transition: border-color .2s ease, transform .2s ease;
  }
  .download-card:hover { border-color: var(--ink-3); }
  .download-card .platform-art {
    height: 100px;
    margin: -8px -28px 0 -28px;
    padding: 0 28px;
    border-bottom: 1px dashed var(--line-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 70%),
      var(--bg-2);
    position: relative;
  }
  .download-card .platform-art::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.4;
    mask-image: linear-gradient(180deg, black, transparent 90%);
  }
  .download-card .platform-art svg { position: relative; }
  .download-head {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: "Geist Mono"; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .download-head .id { color: var(--accent); }
  .download-card h3 {
    font-family: "Space Grotesk"; font-weight: 500;
    font-size: 22px; line-height: 1.15; letter-spacing: -0.01em;
    margin: 0;
  }
  .download-card .req {
    margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.5;
  }
  .download-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    font-family: "Geist Mono"; font-size: 11px;
    color: var(--ink-3);
    padding: 12px 0;
    border-top: 1px dashed var(--line-soft);
    border-bottom: 1px dashed var(--line-soft);
    letter-spacing: 0.02em;
  }
  .download-meta div { display: flex; flex-direction: column; gap: 2px; }
  .download-meta .k { color: var(--ink-3); text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; }
  .download-meta .v { color: var(--ink); }
  .download-cta { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .download-cta .btn { width: 100%; }
  .download-cta .secondary-link {
    text-align: center;
    font-family: "Geist Mono"; font-size: 11px; color: var(--ink-3);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .download-cta .secondary-link a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 4px; }
  .download-cta .secondary-link a:hover { color: var(--ink); }
  @media (max-width: 980px) {
    .download-grid { grid-template-columns: 1fr; }
  }

  /* comparison */
  .compare {
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
  }
  .compare-row {
    display: grid; grid-template-columns: 1.2fr 1.4fr 1.4fr;
    border-bottom: 1px solid var(--line-soft);
  }
  .compare-row:last-child { border-bottom: 0; }
  .compare-row > div {
    padding: 22px 24px;
    font-size: 15px;
    border-right: 1px solid var(--line-soft);
    line-height: 1.5;
  }
  .compare-row > div:last-child { border-right: 0; }
  .compare-row.head > div {
    background: var(--bg-2);
    font-family: "Geist Mono"; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
    padding: 14px 24px;
  }
  .compare-row.head .ours { color: var(--accent); }
  .compare-row .label {
    font-family: "Space Grotesk"; font-weight: 500;
    color: var(--ink); font-size: 15px;
  }
  .compare-row .theirs { color: var(--ink-3); }
  .compare-row .ours { color: var(--ink); font-weight: 500; }
  .compare-row .ours strong {
    display: block; font-weight: 600; color: var(--accent);
    font-family: "Instrument Serif"; font-style: italic; font-weight: 400;
    font-size: 20px; letter-spacing: -0.01em;
    margin-bottom: 2px;
  }

  /* CTA strip */
  .cta-strip {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 64px 56px;
    background: var(--surface);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 40px;
    align-items: center;
  }
  .cta-strip::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 90% at 100% 0%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(40% 80% at 0% 100%, color-mix(in oklab, var(--accent) 10%, transparent), transparent 70%);
    pointer-events: none;
  }
  .cta-strip h2 {
    position: relative;
    font-family: "Instrument Serif";
    font-size: clamp(40px, 5vw, 72px);
    line-height: 0.98; letter-spacing: -0.015em;
    margin: 0;
  }
  .cta-strip h2 em { color: var(--accent); font-style: italic; }
  .cta-strip .pitch {
    position: relative;
    color: var(--ink-2); font-size: 16px;
    max-width: 380px;
  }
  .cta-strip .cta-actions {
    margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap;
  }

  /* pricing */
  .price-grid {

// ---- THEME HOOK ----
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const stored = localStorage.getItem("osm-theme");
    return stored || "dark";
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("osm-theme", theme);
  }, [theme]);
  return [theme, () => setTheme(t => t === "dark" ? "light" : "dark")];
}

// ---- AUTH MODAL ----
function AuthModal({ mode, onMode, onClose }) {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [name, setName] = useState("");
  const [domain, setDomain] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [done, setDone] = useState(false);

  // Close on Esc
  useEffect(() => {
    const h = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);

  const submit = (e) => {
    e.preventDefault();
    setSubmitting(true);
    setTimeout(() => { setSubmitting(false); setDone(true); }, 900);
  };

  const onBackdrop = (e) => { if (e.target === e.currentTarget) onClose(); };

  return (
    <div className="modal-wrap" onMouseDown={onBackdrop}>
      <div className="modal" role="dialog" aria-modal="true">
        <aside className="modal-side">
          <span className="eyebrow"><span className="pulse"/> {mode === "signin" ? "Welcome back" : "Claim your floor"}</span>
          <h3>
            {mode === "signin"
              ? <>Re-enter the <em>sovereign net.</em></>
              : <>Take the <em>throne.</em></>}
          </h3>
          <p>
            {mode === "signin"
              ? "Continue routing your domains to the silicon you actually own."
              : "Five minutes from sign-up to a live subdomain pointing at the hardware on your desk. No credit card. No quotas."}
          </p>
          <ul className="modal-bullets">
            <li>Zero per-vCPU taxes</li>
            <li>Unlimited subdomains</li>
            <li>Hardware-bound TLS, by default</li>
            <li>Sentinel for macOS, Windows, Android</li>
          </ul>
        </aside>

        <div className="modal-main">
          <button className="modal-close" onClick={onClose} aria-label="Close">
            <Icon.Close/>
          </button>

          <div className="modal-tabs">
            <button className={mode === "signin" ? "active" : ""} onClick={() => onMode("signin")}>Sign in</button>
            <button className={mode === "signup" ? "active" : ""} onClick={() => onMode("signup")}>Create account</button>
          </div>

          {done ? (
            <SuccessPanel mode={mode} email={email} onClose={onClose}/>
          ) : (
            <>
              <h4 className="modal-title">
                {mode === "signin" ? "Sign in to your console" : "Forge your sovereign account"}
              </h4>
              <p className="modal-sub">
                {mode === "signin" ? "Welcome back, sovereign." : "Free tier — 3 subdomains, 1 device."}
              </p>

              <div className="oauth-row">
                <button className="oauth-btn"><Icon.Github/> GitHub</button>
                <button className="oauth-btn"><Icon.Google/> Google</button>
              </div>
              <div className="or-divider">OR EMAIL</div>

              <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {mode === "signup" && (
                  <div className="form-field">
                    <label>Full name</label>
                    <input value={name} onChange={e => setName(e.target.value)} placeholder="Satoshi Singh" required/>
                  </div>
                )}
                <div className="form-field">
                  <label>Email</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@yourdomain.com" required/>
                </div>
                <div className="form-row">
                  <div className="form-field">
                    <label>Password</label>
                    <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••••" required minLength={6}/>
                  </div>
                  {mode === "signup" ? (
                    <div className="form-field">
                      <label>Domain (optional)</label>
                      <input value={domain} onChange={e => setDomain(e.target.value)} placeholder="yourdomain.com"/>
                    </div>
                  ) : (
                    <div className="form-field" style={{ justifyContent: "flex-end" }}>
                      <label>&nbsp;</label>
                      <a href="#" style={{ fontSize: 13, color: "var(--ink-2)", textDecoration: "underline", textUnderlineOffset: 3, paddingTop: 12 }}>Forgot password?</a>
                    </div>
                  )}
                </div>
                <button type="submit" className="btn btn-primary btn-lg" disabled={submitting} style={{ marginTop: 4 }}>
                  {submitting
                    ? "negotiating tunnel..."
                    : (mode === "signin" ? <>Sign in <Icon.Arrow/></> : <>Create sovereign account <Icon.Arrow/></>)}
                </button>
                {mode === "signup" && (
                  <p className="terms">
                    By creating an account, you accept the <a href="#">Terms of Sovereignty</a> and acknowledge our <a href="#">Privacy Policy</a>. You retain full ownership of all data and compute.
                  </p>
                )}
              </form>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

      <TopNav
        theme={theme}
        onToggleTheme={toggleTheme}
        onSignin={() => setAuthMode("signin")}
        onSignup={() => setAuthMode("signup")}
      />
      <Hero onSignup={() => setAuthMode("signup")}/>
      <Features/>
      <Downloads onSignup={() => setAuthMode("signup")}/>
      <Compare/>
      <CTAStrip onSignup={() => setAuthMode("signup")}/>
      <Pricing onSignup={() => setAuthMode("signup")}/>
      <Lineage/>
      <Footer/>
      {authMode && (
        <AuthModal
          mode={authMode}
          onMode={setAuthMode}
          onClose={() => setAuthMode(null)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
